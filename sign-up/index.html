<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,700&display=swap" rel="stylesheet" />

  <!-- Base Stylesheets -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/new-styles.css" />

  <!-- favicon -->
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon-precomposed" href="../img/apple-touch-icon.png" />

  <!-- Style -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://kit.fontawesome.com/39a80cd06c.js" crossorigin="anonymous"></script>

  <title>Institutional Registration - Exquisite Investment Limited</title>

  <style>
    body.premium-theme {
      background: radial-gradient(circle at top right, #0a0e14 0%, #05070a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      overflow-x: hidden;
    }

    .auth-container {
      width: 100%;
      max-width: 580px;
      z-index: 10;
    }

    .registration-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 50px 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .input-group-label {
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 10px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
      text-decoration: none;
    }

    .auth-logo img {
      filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .auth-logo span {
      text-transform: uppercase;
      color: white;
      font-size: 20px;
      letter-spacing: 3px;
      font-weight: 800;
      margin-left: 12px;
    }

    /* Custom Checkbox Styling */
    .premium-checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .premium-checkbox-container input {
      display: none;
    }

    .checkmark {
      height: 20px;
      width: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      margin-right: 12px;
      position: relative;
      transition: all 0.3s ease;
    }

    .premium-checkbox-container:hover .checkmark {
      border-color: var(--accent-cyan);
    }

    .premium-checkbox-container input:checked+.checkmark {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
    }

    .premium-checkbox-container input:checked+.checkmark:after {
      content: "\f00c";
      font-family: "Font Awesome 5 Free";
      font-weight: 900;
      position: absolute;
      color: #000;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body class="premium-theme">
  <!-- Background Accents -->
  <div
    style="position: fixed; top: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(0, 242, 255, 0.04) 0%, transparent 70%); z-index: 1;">
  </div>
  <div
    style="position: fixed; bottom: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(111, 0, 255, 0.04) 0%, transparent 70%); z-index: 1;">
  </div>

  <div class="auth-container">
    <!-- Logo -->
    <a href="/" class="auth-logo animate-fade-up">
      <img src="../img/user/logo.png" alt="logo" width="45" height="45" />
      <span>Exquisite</span>
    </a>

    <!-- Registration Card -->
    <div class="registration-card animate-fade-up" style="animation-delay: 0.1s;">
      <div class="uk-text-center uk-margin-large-bottom">
        <h2 class="hero-title" style="font-size: 2.2rem; margin-bottom: 15px;">Create <span
            class="hero-highlight">Account</span></h2>
        <p style="color: var(--text-secondary); line-height: 1.6;">Establish your institutional gateway to precision
          investment and capital management.</p>
      </div>

      <form id="form-signup" class="uk-grid-small" data-uk-grid>
        <div class="uk-width-1-2@s">
          <label class="input-group-label">Legal Name</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-cyan);"><i class="fas fa-user fa-sm"></i></span>
            <input class="uk-input premium-input" type="text" id="fullName" placeholder="Full Name" required />
          </div>
        </div>
        <div class="uk-width-1-2@s">
          <label class="input-group-label">System Alias</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-violet);"><i class="fas fa-at fa-sm"></i></span>
            <input class="uk-input premium-input" type="text" id="userName" placeholder="Username" required />
          </div>
        </div>

        <div class="uk-width-1-1 uk-margin-small-top">
          <label class="input-group-label">Institutional Email</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-cyan);"><i class="fas fa-envelope fa-sm"></i></span>
            <input class="uk-input premium-input" type="email" id="email" placeholder="name@company.com" required />
          </div>
        </div>

        <div class="uk-width-1-2@s uk-margin-small-top">
          <label class="input-group-label">Access Key</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-violet);"><i class="fas fa-lock fa-sm"></i></span>
            <input class="uk-input premium-input" type="password" id="password" placeholder="Create Password"
              minlength="8" required />
          </div>
        </div>
        <div class="uk-width-1-2@s uk-margin-small-top">
          <label class="input-group-label">Validation</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-violet);"><i
                class="fas fa-shield-alt fa-sm"></i></span>
            <input class="uk-input premium-input" type="password" id="confirmPassword" placeholder="Confirm Password"
              minlength="8" required />
          </div>
        </div>

        <div class="uk-width-1-1 uk-margin-small-top">
          <label class="input-group-label">Referral Identification (Optional)</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-cyan); opacity: 0.5;"><i
                class="fas fa-users fa-sm"></i></span>
            <input class="uk-input premium-input" type="text" id="referralId" placeholder="Enter ID if applicable" />
          </div>
        </div>

        <div class="uk-width-1-1 uk-margin-medium-top">
          <div class="uk-flex uk-flex-middle uk-flex-between">
            <!-- <label class="premium-checkbox-container">
              <input type="checkbox" checked="checked" />
              <span class="checkmark"></span>
              <span class="caption">Persistent Session</span>
            </label> -->
            <a href="/login/"
              style="color: var(--accent-cyan); font-weight: 600; text-decoration: none; font-size: 0.9rem;">Already
              registered?</a>
          </div>
        </div>

        <div class="uk-width-1-1 uk-margin-large-top">
          <button id="submit-btn" type="submit" class="uk-width-1-1 btn-premium"
            style="padding: 18px; border-radius: 15px; font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;">
            Establish Protocol
          </button>
        </div>
      </form>
    </div>

    <div class="uk-margin-large-top animate-fade-up" style="animation-delay: 0.2s;">
      <p class="uk-text-center" style="color: rgba(255,255,255,0.25); font-size: 0.8rem; line-height: 1.6;">
        By establishing this protocol, you agree to our <a href="/rules"
          style="color: var(--accent-cyan); text-decoration: none;">Institutional Terms</a> and <a href="/rules"
          style="color: var(--accent-cyan); text-decoration: none;">Security Policy</a>.<br>
        © 2024 Exquisite Investment Limited. Secure Onboarding Module.
      </p>
    </div>
  </div>

  <div id="google_translate_element" style="position: fixed; bottom: 20px; left: 20px; z-index: 400"></div>

  <!-- UIkit & Vendors -->
  <script src="../js/vendors/uikit.min.js"></script>
  <script src="../login-assets/js/jquery-3.3.1.min.js"></script>
  <script src="../login-assets/js/popper.min.js"></script>
  <script src="../login-assets/js/bootstrap.min.js"></script>

  <!-- Auth Logic -->
  <script src="../js/auth.js"></script>

</body>

</html>
