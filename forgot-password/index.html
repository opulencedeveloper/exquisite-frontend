<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,700&display=swap" rel="stylesheet" />

  <!-- Base Stylesheets -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/new-styles.css" />

  <!-- favicon -->
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon-precomposed" href="../img/apple-touch-icon.png" />

  <!-- Style -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://kit.fontawesome.com/39a80cd06c.js" crossorigin="anonymous"></script>

  <title>Restore Access - Exquisite Investment Limited</title>

  <style>
    body.premium-theme {
      background: radial-gradient(circle at top right, #0a0e14 0%, #05070a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      z-index: 10;
    }

    .forgot-form-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 50px 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .input-group-label {
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .auth-logo img {
      filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .auth-logo span {
      text-transform: uppercase;
      color: white;
      font-size: 20px;
      letter-spacing: 3px;
      font-weight: 800;
      margin-left: 12px;
    }
  </style>
</head>

<body class="premium-theme">
  <!-- Background Accents -->
  <div
    style="position: fixed; top: -10%; right: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(0, 242, 255, 0.03) 0%, transparent 70%); z-index: 1;">
  </div>
  <div
    style="position: fixed; bottom: -10%; left: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(111, 0, 255, 0.03) 0%, transparent 70%); z-index: 1;">
  </div>

  <div class="auth-container">
    <!-- Logo -->
    <a href="/" class="auth-logo uk-link-reset animate-fade-up">
      <img src="../img/user/logo.png" alt="logo" width="45" height="45" />
      <span>Exquisite</span>
    </a>

    <!-- Form Card -->
    <div class="forgot-form-card animate-fade-up" style="animation-delay: 0.1s;">
      <div class="uk-text-center uk-margin-large-bottom">
        <h2 class="hero-title" style="font-size: 2rem; margin-bottom: 15px;">Restore <span
            class="hero-highlight">Access</span></h2>
        <p style="color: var(--text-secondary); line-height: 1.6;">Identity verification required. Enter your registered
          institutional email to receive a secure recovery link.</p>
      </div>

      <form id="form-generateResetPasswordLink">
        <div class="uk-margin-medium-bottom">
          <label class="input-group-label">Institutional Email</label>
          <div class="uk-inline uk-width-1-1">
            <span class="uk-form-icon" style="color: var(--accent-cyan);"><i class="fas fa-envelope fa-sm"></i></span>
            <input class="uk-input premium-input" type="email" id="email" placeholder="name@company.com" required />
          </div>
        </div>

        <div class="uk-margin-large-top">
          <button id="submit-btn" type="submit" class="uk-width-1-1 btn-premium"
            style="padding: 16px; border-radius: 15px; font-weight: 700; font-size: 1rem;">
            Authorize Recovery link
          </button>
        </div>

        <div class="uk-margin-medium-top uk-text-center">
          <span style="color: var(--text-secondary); font-size: 0.9rem;">Remembered credentials?</span>
          <a href="/login"
            style="color: var(--accent-cyan); font-weight: 600; margin-left: 5px; text-decoration: none;">Proceed to
            Login</a>
        </div>
      </form>
    </div>

    <p class="uk-text-center animate-fade-up"
      style="color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 30px; animation-delay: 0.2s;">
      © 2024 Exquisite Investment Limited. Secured by AES-256 Institutional Grade Encryption.
    </p>
  </div>

  <div id="google_translate_element" style="position: fixed; bottom: 20px; left: 20px; z-index: 400"></div>

  <!-- Smartsupp Live Chat -->
  <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '2f6384a34fde3586bc7c4efbb118dd5b0600d103';
    window.smartsupp || (function (d) {
      var s, c, o = smartsupp = function () { o._.push(arguments) }; o._ = [];
      s = d.getElementsByTagName('script')[0]; c = d.createElement('script');
      c.type = 'text/javascript'; c.charset = 'utf-8'; c.async = true;
      c.src = 'https://www.smartsuppchat.com/loader.js?'; s.parentNode.insertBefore(c, s);
    })(document);
  </script>

  <script>
    document.getElementById("form-generateResetPasswordLink").addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitBtn = document.getElementById("submit-btn");
      const originalText = submitBtn.textContent;
      submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin uk-margin-small-right"></i> Authorizing...';
      submitBtn.style.opacity = '0.7';
      submitBtn.style.pointerEvents = 'none';

      const formData = {
        email: document.getElementById("email").value,
      };

      try {
        const response = await fetch(
          "https://api.exquisiteinvestmentlimited.com/api/v1/forgot/password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(formData),
          }
        );

        const result = await response.json();

        if (response.ok) {
          Toastify({
            text: "Success: Recovery link dispatched to your inbox.",
            duration: 5000,
            gravity: "top",
            position: "center",
            backgroundColor: "linear-gradient(to right, #00f2ff, #00d4ff)",
            stopOnFocus: true
          }).showToast();
        } else {
          Toastify({
            text: `Protocol Error: ${result.description || "Verification failed"}`,
            duration: 5000,
            gravity: "top",
            position: "center",
            backgroundColor: "#dc3545",
          }).showToast();
        }
      } catch (error) {
        Toastify({
          text: "System Error: Connection to secure gateway failed.",
          duration: 5000,
          gravity: "top",
          position: "center",
          backgroundColor: "#dc3545",
        }).showToast();
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.style.opacity = '1';
        submitBtn.style.pointerEvents = 'auto';
      }
    });

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: "en" }, "google_translate_element");
    }
  </script>
  <script type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
